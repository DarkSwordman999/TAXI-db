name: Сбор поездок такси Чикаго

# Раз в день скачивает новые дни из открытых данных Чикаго
# (data/chicago/rides/ГГГГ/ГГГГ-ММ-ДД.csv.gz) и коммитит их в репозиторий.
# Расписание GitHub запускает только из ветки по умолчанию (main).
on:
  schedule:
    - cron: '30 6 * * *'   # 06:30 UTC ежедневно
  workflow_dispatch:
    inputs:
      days:
        description: 'Сколько последних дней проверить'
        required: false
        default: '45'

permissions:
  contents: write

concurrency:
  group: chicago-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # сборщик использует только стандартную библиотеку — пакеты не нужны
      - name: Скачать новые дни
        run: python parser/chicago_fetch.py --days "${{ github.event.inputs.days || '45' }}"

      - name: Закоммитить новые файлы
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Данные: новые поездки такси Чикаго"
          file_pattern: "data/chicago/rides/**/*.csv.gz"
